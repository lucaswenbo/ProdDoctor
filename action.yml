name: 'ProdDoctor'
description: 'Post-deploy production validation that narrows failures and preserves optional Chromium evidence.'
author: 'Lucas Lu'
branding:
  icon: 'activity'
  color: 'green'

inputs:
  url:
    description: 'Real production URL to validate'
    required: true
  language:
    description: 'Human-readable output language: en or zh-CN'
    required: false
    default: 'en'
  expect:
    description: 'Text that must appear in the raw HTML; leave empty to disable'
    required: false
    default: ''
  status:
    description: 'Exact final HTTP status to require; leave empty to accept any successful status'
    required: false
    default: ''
  expect_json:
    description: 'JSON object mapping JSON Pointers to exact expected values; empty disables JSON assertions'
    required: false
    default: ''
  retries:
    description: 'Number of retries after the initial failed attempt'
    required: false
    default: '2'
  timeout:
    description: 'HTTP request timeout in milliseconds'
    required: false
    default: '15000'
  check_assets:
    description: 'Whether to validate same-origin JavaScript and CSS assets'
    required: false
    default: 'true'
  max_body_bytes:
    description: 'HTTP response body byte limit; 0 preserves unlimited legacy behavior'
    required: false
    default: '0'
  max_assets:
    description: 'Maximum number of same-origin JavaScript and CSS assets to validate'
    required: false
    default: '20'
  tls_warn_days:
    description: 'Warn when the TLS certificate has this many days remaining'
    required: false
    default: '14'

  browser:
    description: 'Enable Playwright + Chromium browser validation'
    required: false
    default: 'false'
  browser_expect:
    description: 'Text that must appear after Chromium renders the page'
    required: false
    default: ''
  browser_timeout:
    description: 'Browser navigation timeout in milliseconds'
    required: false
    default: '30000'
  browser_settle:
    description: 'Extra wait after DOMContentLoaded in milliseconds'
    required: false
    default: '750'
  browser_fail_console:
    description: 'Treat browser console errors as blocking failures'
    required: false
    default: 'false'
  browser_profile:
    description: 'Browser viewport preset: desktop or mobile'
    required: false
    default: 'desktop'
  browser_trace:
    description: 'Playwright trace mode: off, on-failure, or always'
    required: false
    default: 'on-failure'
  upload_screenshot:
    description: 'Save a full-page screenshot during browser validation'
    required: false
    default: 'true'
  upload_report:
    description: 'Generate JSON and HTML production reports during browser validation'
    required: false
    default: 'true'

outputs:
  evidence_dir:
    description: "This invocation's isolated evidence directory (browser mode only)"
    value: ${{ steps.evidence.outputs.dir }}
  evidence_name:
    description: "This invocation's unique artifact name (browser mode only)"
    value: ${{ steps.evidence.outputs.name }}

runs:
  using: 'composite'
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: '20'

    - name: Validate ProdDoctor inputs
      shell: bash
      env:
        PROD_DOCTOR_LANGUAGE: ${{ inputs.language }}
        PROD_DOCTOR_CHECK_ASSETS: ${{ inputs.check_assets }}
        PROD_DOCTOR_BROWSER: ${{ inputs.browser }}
        PROD_DOCTOR_BROWSER_FAIL_CONSOLE: ${{ inputs.browser_fail_console }}
        PROD_DOCTOR_UPLOAD_SCREENSHOT: ${{ inputs.upload_screenshot }}
        PROD_DOCTOR_UPLOAD_REPORT: ${{ inputs.upload_report }}
        PROD_DOCTOR_BROWSER_EXPECT: ${{ inputs.browser_expect }}
        PROD_DOCTOR_BROWSER_PROFILE: ${{ inputs.browser_profile }}
        PROD_DOCTOR_BROWSER_TRACE: ${{ inputs.browser_trace }}
      run: |
        case "$PROD_DOCTOR_LANGUAGE" in
          en|zh-CN) ;;
          *)
            echo "language accepts only en or zh-CN"
            exit 2
            ;;
        esac

        for value in           "$PROD_DOCTOR_CHECK_ASSETS"           "$PROD_DOCTOR_BROWSER"           "$PROD_DOCTOR_BROWSER_FAIL_CONSOLE"           "$PROD_DOCTOR_UPLOAD_SCREENSHOT"           "$PROD_DOCTOR_UPLOAD_REPORT"; do
          case "$value" in
            true|false) ;;
            *)
              echo "Boolean inputs accept only true or false"
              exit 2
              ;;
          esac
        done

        case "$PROD_DOCTOR_BROWSER_PROFILE" in
          desktop|mobile) ;;
          *)
            echo "browser_profile accepts only desktop or mobile"
            exit 2
            ;;
        esac

        case "$PROD_DOCTOR_BROWSER_TRACE" in
          off|on-failure|always) ;;
          *)
            echo "browser_trace accepts only off, on-failure, or always"
            exit 2
            ;;
        esac

        if [ "$PROD_DOCTOR_BROWSER" != "true" ] && [ -n "$PROD_DOCTOR_BROWSER_EXPECT" ]; then
          echo "browser_expect requires browser: true"
          exit 2
        fi

    - name: Install Playwright browser runtime
      if: ${{ inputs.browser == 'true' }}
      shell: bash
      run: |
        PW_DIR="$RUNNER_TEMP/proddoctor-playwright"
        mkdir -p "$PW_DIR"
        cd "$PW_DIR"

        if [ ! -f package.json ]; then
          npm init -y >/dev/null 2>&1
        fi

        npm install --no-save --package-lock=false playwright@1.63.0
        ./node_modules/.bin/playwright install --with-deps chromium

        echo "PRODDOCTOR_PLAYWRIGHT_DIR=$PW_DIR" >> "$GITHUB_ENV"

    - name: Prepare isolated evidence directory
      id: evidence
      if: ${{ inputs.browser == 'true' }}
      shell: bash
      run: |
        EVIDENCE_DIR="$(mktemp -d "$RUNNER_TEMP/proddoctor-evidence-XXXXXXXX")"
        echo "dir=$EVIDENCE_DIR" >> "$GITHUB_OUTPUT"
        echo "name=proddoctor-evidence-${GITHUB_JOB}-$(basename "$EVIDENCE_DIR")" >> "$GITHUB_OUTPUT"

    - name: ProdDoctor production check
      shell: bash
      env:
        PROD_DOCTOR_URL: ${{ inputs.url }}
        PROD_DOCTOR_LANGUAGE: ${{ inputs.language }}
        PROD_DOCTOR_EXPECT: ${{ inputs.expect }}
        PROD_DOCTOR_EXPECT_JSON: ${{ inputs.expect_json }}
        PROD_DOCTOR_STATUS: ${{ inputs.status }}
        PROD_DOCTOR_RETRIES: ${{ inputs.retries }}
        PROD_DOCTOR_TIMEOUT: ${{ inputs.timeout }}
        PROD_DOCTOR_MAX_BODY_BYTES: ${{ inputs.max_body_bytes }}
        PROD_DOCTOR_CHECK_ASSETS: ${{ inputs.check_assets }}
        PROD_DOCTOR_MAX_ASSETS: ${{ inputs.max_assets }}
        PROD_DOCTOR_TLS_WARN_DAYS: ${{ inputs.tls_warn_days }}
        PROD_DOCTOR_BROWSER: ${{ inputs.browser }}
        PROD_DOCTOR_BROWSER_EXPECT: ${{ inputs.browser_expect }}
        PROD_DOCTOR_BROWSER_TIMEOUT: ${{ inputs.browser_timeout }}
        PROD_DOCTOR_BROWSER_SETTLE: ${{ inputs.browser_settle }}
        PROD_DOCTOR_BROWSER_FAIL_CONSOLE: ${{ inputs.browser_fail_console }}
        PROD_DOCTOR_BROWSER_PROFILE: ${{ inputs.browser_profile }}
        PROD_DOCTOR_BROWSER_TRACE: ${{ inputs.browser_trace }}
        PROD_DOCTOR_UPLOAD_SCREENSHOT: ${{ inputs.upload_screenshot }}
        PROD_DOCTOR_UPLOAD_REPORT: ${{ inputs.upload_report }}
        PROD_DOCTOR_EVIDENCE_DIR: ${{ steps.evidence.outputs.dir }}
      run: |
        args=(
          "$PROD_DOCTOR_URL"
          --lang "$PROD_DOCTOR_LANGUAGE"
          --retries "$PROD_DOCTOR_RETRIES"
          --timeout "$PROD_DOCTOR_TIMEOUT"
          --max-body-bytes "$PROD_DOCTOR_MAX_BODY_BYTES"
          --max-assets "$PROD_DOCTOR_MAX_ASSETS"
          --tls-warn-days "$PROD_DOCTOR_TLS_WARN_DAYS"
        )

        if [ -n "$PROD_DOCTOR_EXPECT" ]; then
          args+=(--expect "$PROD_DOCTOR_EXPECT")
        fi

        if [ -n "$PROD_DOCTOR_STATUS" ]; then
          args+=(--status "$PROD_DOCTOR_STATUS")
        fi

        if [ -n "$PROD_DOCTOR_EXPECT_JSON" ]; then
          args+=(--expect-json "$PROD_DOCTOR_EXPECT_JSON")
        fi

        if [ "$PROD_DOCTOR_CHECK_ASSETS" = "false" ]; then
          args+=(--no-assets)
        fi

        if [ "$PROD_DOCTOR_BROWSER" = "true" ]; then
          EVIDENCE_DIR="$PROD_DOCTOR_EVIDENCE_DIR"

          args+=(
            --browser
            --browser-timeout "$PROD_DOCTOR_BROWSER_TIMEOUT"
            --browser-settle "$PROD_DOCTOR_BROWSER_SETTLE"
            --browser-profile "$PROD_DOCTOR_BROWSER_PROFILE"
            --browser-trace "$PROD_DOCTOR_BROWSER_TRACE"
          )

          if [ -n "$PROD_DOCTOR_BROWSER_EXPECT" ]; then
            args+=(--browser-expect "$PROD_DOCTOR_BROWSER_EXPECT")
          fi

          if [ "$PROD_DOCTOR_BROWSER_FAIL_CONSOLE" = "true" ]; then
            args+=(--browser-fail-console)
          fi

          if [ "$PROD_DOCTOR_UPLOAD_SCREENSHOT" = "true" ]; then
            args+=(--browser-screenshot "$EVIDENCE_DIR/browser.png")
          fi

          if [ "$PROD_DOCTOR_BROWSER_TRACE" != "off" ]; then
            args+=(--browser-trace-path "$EVIDENCE_DIR/trace.zip")
          fi

          if [ "$PROD_DOCTOR_UPLOAD_REPORT" = "true" ]; then
            args+=(
              --json-file "$EVIDENCE_DIR/report.json"
              --html-report "$EVIDENCE_DIR/report.html"
            )
          fi
        fi

        node "$GITHUB_ACTION_PATH/bin/proddoctor.mjs" "${args[@]}"

    - name: Upload ProdDoctor evidence
      if: ${{ always() && steps.evidence.outputs.dir != '' && inputs.browser == 'true' && (inputs.upload_screenshot == 'true' || inputs.upload_report == 'true' || inputs.browser_trace != 'off') }}
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: ${{ steps.evidence.outputs.name }}
        path: ${{ steps.evidence.outputs.dir }}/*
        if-no-files-found: warn
        retention-days: 7
