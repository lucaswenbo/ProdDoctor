name: Automated release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write
  statuses: write

concurrency:
  group: proddoctor-release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20'

      # Validate BEFORE Release Please can publish any tag/release.
      - name: Validate main before publication
        shell: bash
        run: |
          set -euo pipefail
          npm run release:integrity
          npm run check
          VERSION="$(node -p "require('./package.json').version")"
          LATEST="$(git tag --merged HEAD --list 'v*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1)"
          if [ "v$VERSION" != "$LATEST" ]; then npm run release:policy; fi

      - name: Start deterministic browser fixture
        run: |
          node scripts/smoke-server.mjs &
          for attempt in {1..30}; do
            if curl --noproxy '*' --silent --show-error --fail http://127.0.0.1:18765/ >/dev/null; then exit 0; fi
            sleep 1
          done
          exit 1

      - name: Main lightweight smoke
        uses: ./
        with:
          url: https://example.com
          expect: Example Domain
          status: 200
      - name: Main Chromium smoke
        id: main-browser
        uses: ./
        with:
          url: http://127.0.0.1:18765/
          browser: true
          browser_expect: ProdDoctor browser ready
          browser_profile: mobile
          browser_trace: always
      - name: Check main evidence
        env:
          EVIDENCE_DIR: ${{ steps.main-browser.outputs.evidence_dir }}
        run: |
          node scripts/verify-report-version.mjs "$EVIDENCE_DIR/report.json"
          test -s "$EVIDENCE_DIR/report.json"
          test -s "$EVIDENCE_DIR/report.html"
          test -s "$EVIDENCE_DIR/browser.png"
          test -s "$EVIDENCE_DIR/trace.zip"

      - name: Refuse publication from an outdated run
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: test "$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq .object.sha)" = "$EXPECTED_SHA"

      - name: Run Release Please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          target-branch: main
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Verify fixed tags after Release Please
        run: npm run release:integrity

      # Idempotent: repair vN on retry too; NEVER move concrete vN.N.N tags.
      - name: Reconcile floating major tag from latest published release
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_JSON="$(gh api "repos/$GH_REPO/releases/latest")"
          RELEASE_TAG="$(jq -er '.tag_name' <<< "$RELEASE_JSON")"
          RELEASE_TARGET="$(jq -er '.target_commitish | select(type == "string" and test("^[0-9a-f]{40}$"))' <<< "$RELEASE_JSON")"
          [[ "$RELEASE_TAG" =~ ^v([0-9]+)\.[0-9]+\.[0-9]+$ ]]
          FLOATING_TAG="v${BASH_REMATCH[1]}"
          git fetch origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          RELEASE_SHA="$(git rev-parse "$RELEASE_TAG^{commit}")"
          test "$RELEASE_SHA" = "$RELEASE_TARGET"
          git merge-base --is-ancestor "$RELEASE_SHA" HEAD
          CURRENT="$(git ls-remote origin "refs/tags/$FLOATING_TAG" | cut -f1)"
          git push --force-with-lease="refs/tags/$FLOATING_TAG:$CURRENT" origin "$RELEASE_SHA:refs/tags/$FLOATING_TAG"

      - name: Read Release PR metadata
        if: steps.release.outputs.prs_created == 'true'
        id: pr
        env:
          RELEASE_PR: ${{ steps.release.outputs.pr }}
        run: |
          set -euo pipefail
          NUMBER="$(jq -er '.number | select(type == "number")' <<< "$RELEASE_PR")"
          HEAD="$(jq -er '.headBranchName | select(type == "string" and startswith("release-please--"))' <<< "$RELEASE_PR")"
          echo "number=$NUMBER" >> "$GITHUB_OUTPUT"
          echo "head=$HEAD" >> "$GITHUB_OUTPUT"

      - name: Keep Release PR in draft while validating
        if: steps.pr.outputs.number != ''
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          set -euo pipefail
          if [ "$(gh pr view "$PR_NUMBER" --repo "$GH_REPO" --json isDraft --jq .isDraft)" != true ]; then
            gh pr ready "$PR_NUMBER" --repo "$GH_REPO" --undo
          fi

      - name: Checkout Release PR
        if: steps.pr.outputs.number != ''
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ steps.pr.outputs.head }}
          fetch-depth: 0

      - name: Sync public version references
        if: steps.pr.outputs.number != ''
        env:
          PR_HEAD: ${{ steps.pr.outputs.head }}
        run: |
          set -euo pipefail
          npm run release:sync
          # The default workflow token must never need workflows write permission.
          git diff --exit-code -- .github/workflows
          if ! git diff --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add README.md README.zh-CN.md package.json bin src test examples .release-please-manifest.json
            git commit -m 'chore: sync release version references'
            git push origin "HEAD:$PR_HEAD"
          fi

      - name: Attach release gate to exact PR commit
        if: steps.pr.outputs.number != ''
        id: gate
        run: |
          set -euo pipefail
          SHA="$(git rev-parse HEAD)"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          gh api --method POST "repos/$GH_REPO/statuses/$SHA" -f state=pending -f context='release-gate' -f description='Validating this exact release commit'

      - name: Validate release version policy and unit checks
        if: steps.gate.outputs.sha != ''
        run: npm run release:policy && npm run check

      - name: Release gate - lightweight Action smoke
        if: steps.gate.outputs.sha != ''
        uses: ./
        with:
          url: https://example.com
          expect: Example Domain
          status: 200

      - name: Release gate - Chromium smoke
        if: steps.gate.outputs.sha != ''
        id: pr-browser
        uses: ./
        with:
          url: http://127.0.0.1:18765/
          browser: true
          browser_expect: ProdDoctor browser ready
          browser_profile: mobile
          browser_trace: always

      - name: Verify release evidence and unchanged PR head
        if: steps.gate.outputs.sha != ''
        env:
          EVIDENCE_DIR: ${{ steps.pr-browser.outputs.evidence_dir }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          EXPECTED_SHA: ${{ steps.gate.outputs.sha }}
        run: |
          set -euo pipefail
          node scripts/verify-report-version.mjs "$EVIDENCE_DIR/report.json"
          test -s "$EVIDENCE_DIR/browser.png"
          test -s "$EVIDENCE_DIR/report.html"
          test -s "$EVIDENCE_DIR/report.json"
          test -s "$EVIDENCE_DIR/trace.zip"
          test "$(gh pr view "$PR_NUMBER" --repo "$GH_REPO" --json headRefOid --jq .headRefOid)" = "$EXPECTED_SHA"

      - name: Publish exact-SHA release gate result
        if: always() && steps.gate.outputs.sha != ''
        env:
          GATE_SHA: ${{ steps.gate.outputs.sha }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          STATE=failure
          if [ "$JOB_STATUS" = success ]; then STATE=success; fi
          gh api --method POST "repos/$GH_REPO/statuses/$GATE_SHA" -f "state=$STATE" -f context='release-gate' -f "description=Release gate $STATE" -f "target_url=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

      - name: Mark validated Release PR ready
        if: success() && steps.gate.outputs.sha != ''
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          GATE_SHA: ${{ steps.gate.outputs.sha }}
        run: |
          set -euo pipefail
          gh pr ready "$PR_NUMBER" --repo "$GH_REPO"
          gh pr comment "$PR_NUMBER" --repo "$GH_REPO" --body "Automated release gate passed for $GATE_SHA: version policy, unit tests, Action smoke, Chromium smoke and evidence checks. Ready for final review and merge."
