# 内部狗粮测试：故意使用当前 checkout 的本地 Action（uses: ./）。
# 这不是给最终用户复制的示例；用户文档应锁定具体版本 tag 或完整 commit SHA。

name: Browser smoke test

on:
  push:
    branches: [main]
    paths:
      - action.yml
      - bin/**
      - src/browser.mjs
      - src/checker.mjs
      - src/report.mjs
      - src/html-report.mjs
      - scripts/smoke-server.mjs
      - .github/workflows/browser-smoke.yml
      - .github/workflows/release-please.yml
  pull_request:
    paths:
      - action.yml
      - bin/**
      - src/browser.mjs
      - src/checker.mjs
      - src/report.mjs
      - src/html-report.mjs
      - scripts/smoke-server.mjs
      - .github/workflows/browser-smoke.yml
      - .github/workflows/release-please.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20'

      - name: Start deterministic browser fixture
        run: |
          node scripts/smoke-server.mjs &
          for attempt in {1..30}; do
            if curl --noproxy '*' --silent --show-error --fail http://127.0.0.1:18765/ >/dev/null; then exit 0; fi
            sleep 1
          done
          exit 1

      - name: Run ProdDoctor with Chromium evidence
        id: doctor
        uses: ./
        with:
          url: http://127.0.0.1:18765/
          status: 200
          browser: true
          browser_expect: ProdDoctor browser ready
          browser_timeout: 30000
          browser_settle: 250
          browser_fail_console: false
          browser_profile: mobile
          browser_trace: always
          upload_screenshot: true
          upload_report: true

      - name: Verify evidence bundle
        shell: bash
        env:
          EVIDENCE_DIR: ${{ steps.doctor.outputs.evidence_dir }}
        run: |
          node scripts/verify-report-version.mjs "$EVIDENCE_DIR/report.json"
          cd "$EVIDENCE_DIR"
          test -s browser.png
          test -s trace.zip
          test -s report.json
          test -s report.html

          grep -q 'ProdDoctor Production Report' report.html
          grep -q '"profile": "mobile"' report.json

      - name: A second Chinese browser invocation cannot overwrite the first evidence
        id: second
        uses: ./
        with:
          url: http://127.0.0.1:18765/
          language: zh-CN
          browser: true
          browser_expect: ProdDoctor browser ready
          browser_trace: always

      - name: Verify evidence isolation
        shell: bash
        env:
          FIRST_DIR: ${{ steps.doctor.outputs.evidence_dir }}
          SECOND_DIR: ${{ steps.second.outputs.evidence_dir }}
          FIRST_NAME: ${{ steps.doctor.outputs.evidence_name }}
          SECOND_NAME: ${{ steps.second.outputs.evidence_name }}
        run: |
          test "$FIRST_DIR" != "$SECOND_DIR"
          test "$FIRST_NAME" != "$SECOND_NAME"
          test -s "$FIRST_DIR/trace.zip"
          test -s "$SECOND_DIR/trace.zip"
