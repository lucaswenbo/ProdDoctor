# 内部狗粮测试：故意使用当前 checkout 的本地 Action（uses: ./）。
# 这不是给最终用户复制的示例；用户文档应锁定具体版本 tag 或完整 commit SHA。

name: Smoke test GitHub Action

on:
  push:
    branches: [main]
    paths:
      - action.yml
      - bin/**
      - src/**
      - scripts/smoke-server.mjs
      - test/**
      - .github/workflows/action-smoke.yml
      - .github/workflows/release-please.yml
  pull_request:
    paths:
      - action.yml
      - bin/**
      - src/**
      - scripts/smoke-server.mjs
      - test/**
      - .github/workflows/action-smoke.yml
      - .github/workflows/release-please.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Minimal usage with current defaults
        uses: ./
        with:
          url: https://example.com
          retries: 1
          timeout: 15000

      - name: Expected content and exact status in Chinese
        uses: ./
        with:
          url: https://example.com
          language: zh-CN
          expect: Example Domain
          status: 200
          retries: 1
          timeout: 15000
          check_assets: true
          max_assets: 20
          tls_warn_days: 14

      - name: Assets can be disabled
        uses: ./
        with:
          url: https://example.com
          check_assets: false

      - name: Start local API fixture
        shell: bash
        run: |
          node scripts/smoke-server.mjs &
          for attempt in {1..30}; do
            if curl --noproxy '*' --silent --show-error --fail http://127.0.0.1:18765/api/healthy >/dev/null; then exit 0; fi
            sleep 1
          done
          exit 1

      - name: Critical API JSON assertions pass
        uses: ./
        with:
          url: http://127.0.0.1:18765/api/healthy
          status: 200
          expect_json: '{"/healthy":true,"/dependencies/database":"ready"}'
          retries: 0
          max_body_bytes: 1024

      - name: HTTP 200 with unhealthy JSON must fail
        id: unhealthy
        continue-on-error: true
        uses: ./
        with:
          url: http://127.0.0.1:18765/api/unhealthy
          language: zh-CN
          status: 200
          expect_json: '{"/healthy":true}'
          retries: 0

      - name: Verify the unhealthy response was blocked
        env:
          OUTCOME: ${{ steps.unhealthy.outcome }}
        run: test "$OUTCOME" = failure
