# 用户示例：默认锁定具体版本 v2.1.2。
# 生产流水线建议把 v2.1.2 替换为该 tag 对应的完整 commit SHA。

name: Verify real production

on:
  workflow_dispatch:
  deployment_status:

jobs:
  verify:
    name: Verify ${{ matrix.name }}
    if: github.event_name != 'deployment_status' || github.event.deployment_status.state == 'success'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: homepage
            url: https://example.com
            expect: Example Domain
            expect_json: ''
          - name: documentation
            url: https://example.com/docs
            expect: Documentation
            expect_json: ''
          - name: health-api
            url: https://example.com/api/health
            expect: ''
            expect_json: '{"/healthy":true,"/dependencies/database":"ready"}'

    steps:
      - uses: lucaswenbo/ProdDoctor@v2.1.2
        with:
          url: ${{ matrix.url }}
          expect: ${{ matrix.expect }}
          expect_json: ${{ matrix.expect_json }}
          status: 200
          retries: 2
          timeout: 15000
          check_assets: true
          max_assets: 20
          tls_warn_days: 14
